      opacity: .48;
      filter: saturate(.72) contrast(.94);
      transform-origin: 50% 50%;
      will-change: transform;
      animation: throw-money var(--duration) linear var(--delay) infinite;
      box-shadow: 0 7px 16px rgb(0 0 0 / .12);
    }

    @media (prefers-color-scheme: dark) {
      .bill {
        opacity: .42;
        filter: grayscale(.15) brightness(.9);
        mix-blend-mode: screen;
      }
    }

    @keyframes throw-money {
      0% {
        transform: translate3d(var(--start-x), 0, 0) rotate(var(--start-r));
      }
      42% {
        transform: translate3d(var(--mid-x), var(--rise), 0) rotate(var(--mid-r));
      }
      100% {
        transform: translate3d(var(--end-x), -122vh, 0) rotate(var(--end-r));
      }
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: grid;
      align-items: end;
      padding:
        max(28px, env(safe-area-inset-top))
        clamp(24px, 5.5vw, 88px)
        max(32px, calc(env(safe-area-inset-bottom) + 22px));
    }

    h1 {
      margin: 0;
      font-weight: 600;
    }

    .setup,
    .payoff {
      display: block;
      white-space: nowrap;
    }

    .setup {
      margin-bottom: .14em;
      font-size: clamp(2.4rem, 5.6vw, 6.6rem);
      line-height: .9;
      letter-spacing: -.065em;
    }

    .payoff {
      font-size: clamp(6.5rem, 19vw, 18rem);
      line-height: .72;
      letter-spacing: -.095em;
    }

    p {
      margin: clamp(32px, 4.5vw, 60px) 0 0;
      font-size: clamp(1rem, 1.5vw, 1.35rem);
      font-weight: 500;
      letter-spacing: -.02em;
    }

    .corner-note {
      position: fixed;
      z-index: 2;
      margin: 0;
      color: var(--ink);
      opacity: .38;
      font-size: clamp(.66rem, .75vw, .78rem);
      font-weight: 500;
      letter-spacing: .01em;
    }

    .city-mark,
    .signature {
      width: min(24ch, 42vw);
      white-space: nowrap;
    }

    .city-mark {
      top: max(28px, env(safe-area-inset-top));
      left: clamp(24px, 5.5vw, 88px);
      text-align: left;
    }

    .signature {
      right: clamp(24px, 5.5vw, 88px);
      bottom: max(32px, calc(env(safe-area-inset-bottom) + 22px));
      text-align: right;
    }

    .typewriter {
      display: inline-block;
      min-height: 1.25em;
    }

    .typewriter::after {
      content: "";
      display: inline-block;
      width: 1px;
      height: .9em;
      margin-left: .2em;
      background: currentColor;
      vertical-align: -.08em;
      animation: cursor-blink .8s steps(1, end) infinite;
    }

    @keyframes cursor-blink {
      50% { opacity: 0; }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .period { color: var(--accent); }

    @media (max-width: 520px) {
      main { align-items: center; }
      .setup { font-size: clamp(2.6rem, 12vw, 4rem); }
      .payoff { font-size: clamp(6.2rem, 28vw, 8.5rem); }
      .bill { width: clamp(76px, 24vw, 104px); }
      .signature { max-width: 66vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      .money-rain { display: none; }
      .typewriter::after { display: none; }
    }

    @media (forced-colors: active) {
      .period { color: LinkText; }
      .bill { opacity: .35; }
    }
  </style>
</head>
<body>
  <div class="money-rain" aria-hidden="true"></div>
  <p class="corner-note city-mark">
    <span aria-hidden="true">SF, SF.</span>
    <span class="sr-only">SF, SF.</span>
  </p>
  <main>
    <div>
      <h1>
        <span class="setup">When done,</span>
        <span class="payoff">smirk<span class="period" aria-hidden="true">.</span></span>
      </h1>
      <p>Smirking soon.</p>
    </div>
  </main>
  <p class="corner-note signature">
    <span class="typewriter" data-start="1" aria-hidden="true">Smirk Fund, San Francisco.</span>
    <span class="sr-only">Smirk Fund, San Francisco. SF, SF.</span>
  </p>
  <script>
    (function () {
      var field = document.querySelector('.money-rain');
      var count = window.matchMedia('(max-width: 520px)').matches ? 12 : 20;

      for (var i = 0; i < count; i += 1) {
        var bill = document.createElement('div');
        var start = -24 + Math.random() * 25;
        var mid = 26 + Math.random() * 30;
        var end = 84 + Math.random() * 28;
        var direction = i % 2 === 0 ? 1 : -1;

        bill.className = 'bill';
        bill.style.setProperty('--start-x', start + 'vw');
        bill.style.setProperty('--mid-x', mid + 'vw');
        bill.style.setProperty('--end-x', end + 'vw');
        bill.style.setProperty('--rise', (-48 - Math.random() * 28) + 'vh');
        bill.style.setProperty('--start-r', (direction * (-34 - Math.random() * 28)) + 'deg');
        bill.style.setProperty('--mid-r', (direction * (85 + Math.random() * 170)) + 'deg');
        bill.style.setProperty('--end-r', (direction * (330 + Math.random() * 420)) + 'deg');
        bill.style.setProperty('--duration', (5.8 + Math.random() * 4.8) + 's');
        bill.style.setProperty('--delay', (-Math.random() * 10.6) + 's');
        field.appendChild(bill);
      }

      var typewriters = document.querySelectorAll('.typewriter');
      var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var phrases = ['SF, SF.', 'Smirk Fund, San Francisco.'];

      function animateTypewriter(typewriter) {
        var phraseIndex = Number(typewriter.getAttribute('data-start')) || 0;
        var characterIndex = phrases[phraseIndex].length;
        var deleting = true;

        function typeNext() {
          var phrase = phrases[phraseIndex];
          var delay = deleting ? 56 : 88;

          if (deleting) {
            characterIndex -= 1;
            typewriter.textContent = phrase.slice(0, characterIndex);

            if (characterIndex === 0) {
              deleting = false;
              phraseIndex = (phraseIndex + 1) % phrases.length;
              delay = 420;
            }
          } else {
            characterIndex += 1;
            phrase = phrases[phraseIndex];
            typewriter.textContent = phrase.slice(0, characterIndex);

            if (characterIndex === phrase.length) {
              deleting = true;
              delay = 1700;
            }
          }

          window.setTimeout(typeNext, delay);
        }

        window.setTimeout(typeNext, 1500);
      }

      for (var j = 0; j < typewriters.length; j += 1) {
        if (reducedMotion) {
          typewriters[j].textContent = phrases[Number(typewriters[j].getAttribute('data-start')) || 0];
        } else {
          animateTypewriter(typewriters[j]);
        }
      }
    }());
  </script>
</body>
</html>
